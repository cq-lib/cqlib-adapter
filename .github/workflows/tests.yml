name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install package and test dependencies
        # This adapter targets classic cqlib 1.3.x (cqlib.circuits / TianYanPlatform),
        # not cqlib 1.4.0b1. Install the published package so CI exercises the
        # real 1.3.x surface. Live TianYan jobs are skipped without CQLIB_TOKEN.
        run: |
          python -m pip install "pytest>=8"
          python -m pip install .
      - name: Run tests
        run: python -m pytest
