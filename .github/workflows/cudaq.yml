name: CUDA-Q Linux

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cudaq:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cq-lib/cqlib
          ref: 21f4814ce2cc7798b7102618d5a7617b47cd75b7
          path: .ci-deps/cqlib
      - uses: actions/checkout@v4
        with:
          repository: cq-lib/cqlib-tianyan
          ref: ea3e88bb367e575f33ba1f9eca25aa283b77bd3c
          path: .ci-deps/cqlib-tianyan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CUDA-Q native build prerequisite
        run: python -m pip install --upgrade pip maturin
      - name: Build and install cqlib Python extension
        working-directory: .ci-deps/cqlib/crates/binding-python
        run: python -m pip install .
      - name: Build and install cqlib-tianyan Python extension
        working-directory: .ci-deps/cqlib-tianyan/crates/binding-python
        run: python -m pip install .
      - name: Install documented Linux development surface
        run: python -m pip install -e ".[dev,cudaq]"
      - name: Verify CUDA-Q CPU target
        run: >-
          python -c "import cudaq; cudaq.set_target('qpp-cpu');
          print(cudaq.get_target())"
      - name: Run documented Linux default coverage command
        run: >-
          python -m pytest --cov=cqlib_adapter --cov-report=term-missing
          -m "not cloud"
