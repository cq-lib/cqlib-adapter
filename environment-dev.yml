name: cqlib-adapter-dev
# This file creates the Python, optional-framework, and tooling environment.
# The native cqlib/cqlib-tianyan bindings are pulled from PyPI by -e ".[dev]".
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - numpy>=2.1
  - build>=1.2
  - hypothesis>=6.100
  - mypy>=1.15
  - pre-commit>=4
  - pytest>=8.4
  - pytest-cov>=6
  - ruff>=0.12
  - twine>=6
  - pip:
      - qiskit>=2.1,<3
      - cirq-core>=1.7,<2
      - pennylane>=0.44,<1
